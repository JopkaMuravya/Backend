security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: phone
        
        oauth_user_provider:
            id: App\Security\Core\User\OAuthUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        admin:
            pattern: ^/admin
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                default_target_path: /admin
                username_parameter: _username
                password_parameter: _password
            logout:
                path: admin_logout
                target: admin_login

        main:
            pattern: ^/(?!api|admin)
            lazy: true
            provider: app_user_provider
            entry_point: form_login
            
            oauth:
                resource_owners:
                    yandex: "/connect/check-yandex"
                login_path: app_login
                failure_path: app_login
                default_target_path: /
                oauth_user_provider:
                    service: 'App\Security\Core\User\OAuthUserProvider'
            
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: /
                username_parameter: _username
                password_parameter: _password
            
            logout:
                path: /logout
                target: /

        api:
            pattern: ^/api
            lazy: true
            provider: app_user_provider
            stateless: true
            
            json_login:
                check_path: api_login
                username_path: phone
                password_path: password


    access_control:
        # Публичные маршруты для веб-части
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/connect, roles: PUBLIC_ACCESS }
        
        # Публичные маршруты для API
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/houses, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/bookings/pending, methods: [GET], roles: PUBLIC_ACCESS }
        
        # Админка
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        
        # Остальные маршруты API требуют авторизации
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/(?!login|register|connect), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10